name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "boto3>=1.34,<2.0"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "boto3>=1.34,<2.0"
      - run: docker run -d --name muscles-data-minio -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:RELEASE.2024-10-13T13-34-11Z server /data --console-address :9001
      - run: docker ps -a && docker logs muscles-data-minio
      - run: curl --retry 90 --retry-connrefused --retry-delay 2 http://127.0.0.1:9000/minio/health/live
      - run: python -m pytest -q -m integration
        env:
          MUSCLES_DATA_INTEGRATION: "1"
          S3_ENDPOINT_URL: http://127.0.0.1:9000
